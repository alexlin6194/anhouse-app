<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會員登入|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261114c">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>歡迎回來</h2>
    <p>登入後依您的權限<br>開啟專屬管理主頁</p>
    <div class="feat">
      <div>🔑 手機門號+密碼快速登入</div>
      <div>📊 各角色獨立工作台</div>
      <div>🔔 帳單與報修即時通知</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="nav"><a class="back" href="index.html" aria-label="返回首頁">←</a> 會員登入</div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="phone">手機號碼</label>
          <input id="phone" type="tel" inputmode="numeric" placeholder="09xxxxxxxx" autocomplete="username" maxlength="10">
        </div>
        <div class="field">
          <label for="password">密碼</label>
          <div class="pw-wrap">
            <input id="password" type="password" placeholder="請輸入密碼" autocomplete="current-password">
            <button type="button" class="pw-eye" data-for="password" aria-label="顯示密碼">
              <svg class="i-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a19.8 19.8 0 0 1-3.22 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn primary" id="loginBtn">登 入</button>
        <p style="text-align:right;font-size:12.5px;margin:10px 6px 0"><a class="link" href="forgot_password.html">忘記密碼/重發驗證信</a></p>
        <p class="foot">還沒有帳號?<a class="link" href="register.html">免費註冊</a></p>
      </form>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="assets/js/pw.js?v=20261114c"></script>
<script src="login.js?v=20261114c"></script>
</body>
</html>
