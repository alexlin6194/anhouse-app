<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>重設密碼|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261113z">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>重設密碼</h2>
    <p>請設定新的登入密碼<br>8 碼以上,含英文與數字</p>
    <div class="feat">
      <div>🔒 連結僅能使用一次</div>
      <div>🧹 重設後自動清除登入鎖定</div>
      <div>🔑 完成後請用新密碼登入</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="nav"><a class="back" href="login.html" aria-label="返回登入">←</a> 重設密碼</div>
      <div class="card flat" id="tokenBad" style="display:none;padding:16px">
        <p style="font-size:13px;color:var(--err);line-height:1.8;margin:0">❌ 連結無效或已過期,請回到<a class="link" href="forgot_password.html">忘記密碼頁</a>重新申請。</p>
      </div>
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">新密碼</label>
          <div class="pw-wrap">
            <input id="password" type="password" placeholder="8 碼以上,含英文與數字" autocomplete="new-password">
            <button type="button" class="pw-eye" data-for="password" aria-label="顯示密碼">
              <svg class="i-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a19.8 19.8 0 0 1-3.22 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="hint" id="hint-password" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="confirm_password">確認新密碼</label>
          <div class="pw-wrap">
            <input id="confirm_password" type="password" placeholder="再次輸入新密碼" autocomplete="new-password">
            <button type="button" class="pw-eye" data-for="confirm_password" aria-label="顯示密碼">
              <svg class="i-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a19.8 19.8 0 0 1-3.22 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="hint" id="hint-confirm" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn primary" id="resetBtn">完成重設</button>
      </form>
      <p class="foot">重設完成後將自動返回登入頁</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const RE_PASS = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
  const $ = s => document.querySelector(s);
  const state = { passOk: false, confirmOk: false };
  const toast = $('#toast');
  let timer;
  function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(()=>toast.classList.remove('show'), 2400); }
  function hint(id, type, text){ const el = $(id); el.textContent = text || ''; el.classList.toggle('err', type==='err'); el.classList.toggle('ok', type==='ok'); }
  function mark(el, ok){ el.classList.toggle('good', ok); el.classList.toggle('bad', !ok); }

  if (!/^[0-9a-f]{64}$/.test(token)) {
    document.getElementById('tokenBad').style.display = 'block';
    document.getElementById('resetForm').style.display = 'none';
  }

  const passEl = $('#password'), confirmEl = $('#confirm_password');
  function checkPass(){
    state.passOk = RE_PASS.test(passEl.value);
    mark(passEl, passEl.value ? state.passOk : false);
    hint('#hint-password', passEl.value ? (state.passOk ? 'ok' : 'err') : '', passEl.value ? (state.passOk ? '✓ 密碼格式符合' : '需 8 碼以上,含英文與數字') : '');
    if (!confirmEl.value) { state.confirmOk = false; hint('#hint-confirm', '', ''); confirmEl.classList.remove('bad','good'); return; }
    state.confirmOk = confirmEl.value === passEl.value;
    mark(confirmEl, state.confirmOk);
    hint('#hint-confirm', state.confirmOk ? 'ok' : 'err', state.confirmOk ? '✓ 兩次輸入一致' : '兩次輸入的密碼不一致');
  }
  passEl.addEventListener('input', checkPass);
  confirmEl.addEventListener('input', checkPass);

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!state.passOk) { showToast('密碼需 8 碼以上,含英文與數字'); return; }
    if (!state.confirmOk) { showToast('兩次輸入的密碼不一致'); return; }
    const btn = $('#resetBtn');
    btn.disabled = true;
    try {
      const res = await fetch('api/reset_password.php', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ token, password: passEl.value, confirm_password: confirmEl.value })
      });
      const data = await res.json();
      showToast(data.message);
      if (data.ok && data.redirect) setTimeout(() => location.href = data.redirect, 1400);
      else btn.disabled = false;
    } catch(err){ btn.disabled = false; showToast('連線異常,請稍後再試'); }
  });
})();
</script>
<script src="assets/js/pw.js?v=20261113z"></script>
</body>
</html>
