<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>忘記密碼|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261114b">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>找回您的帳號</h2>
    <p>輸入註冊時的手機或 Email<br>系統將寄出重設連結</p>
    <div class="feat">
      <div>🔐 重設連結 30 分鐘內有效</div>
      <div>📩 驗證信未收到也可由此重發</div>
      <div>🛡 連結一次性使用,安全無虞</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="nav"><a class="back" href="login.html" aria-label="返回登入">←</a> 忘記密碼/重發驗證信</div>
      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="identifier">手機號碼 或 註冊 Email</label>
          <input id="identifier" type="text" placeholder="09xxxxxxxx 或 example@mail.com" autocomplete="username">
          <p class="hint" id="hint-id" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn primary" id="sendBtn">寄出處理信</button>
        <div class="card flat" style="padding:12px 16px">
          <p style="font-size:12px;color:var(--brown2);line-height:1.8;margin:0">📩 若您尚未完成 <b>Email 驗證</b>,由此寄出的信件同時包含驗證連結,一併處理。</p>
        </div>
        <p class="foot">想起密碼了?<a class="link" href="login.html">返回登入</a></p>
      </form>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  const idEl = document.getElementById('identifier');
  const toast = document.getElementById('toast');
  const hint = document.getElementById('hint-id');
  let timer;
  function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(()=>toast.classList.remove('show'), 2600); }
  idEl.addEventListener('input', () => {
    const v = idEl.value.trim();
    const isPhone = /^09\d{8}$/.test(v.replace(/\D/g, ''));
    const isMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    if (!v) { hint.textContent = ''; hint.className = 'hint'; return; }
    hint.textContent = isPhone || isMail ? '✓ 格式正確' : '請輸入 09 開頭手機或正確 Email';
    hint.className = 'hint ' + (isPhone || isMail ? 'ok' : 'err');
  });
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = idEl.value.trim();
    if (!v) { showToast('請輸入手機號碼或 Email'); return; }
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    try {
      const res = await fetch('api/forgot_password.php', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ identifier: v })
      });
      const data = await res.json();
      showToast(data.message);
    } catch(err){ showToast('連線異常,請稍後再試'); }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
