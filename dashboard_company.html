<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公司後台|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261115ii">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>公司後台</h2>
    <p>組織管理、員工帳號<br>訂閱與稽核</p>
    <div class="feat">
      <div>🏢 組織審核狀態一目瞭然</div>
      <div>👥 員工帳號與級距額度</div>
      <div>💳 訂閱戶數跨分店合計</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="dash-head">
        <div class="avatar" id="avatar">…</div>
        <div class="who"><b id="greet">載入中…</b><span class="pill" id="rolePill">公司</span><span id="orgLine"></span></div>
        <a class="bell" href="notifications.html" aria-label="通知中心">🔔<i id="bellBadge" style="display:none"></i></a>
      </div>

      <div class="stats" id="stats"></div>

      <div class="card" id="orgCard"><div class="row"><div class="ico">🏢</div>
        <div><span class="tagline">組織狀態</span><h4 id="orgName"></h4><p id="orgNote"></p></div>
        <span class="st idle" id="orgSt"></span></div>
      </div>

      <div class="card"><div class="row"><div class="ico">💳</div>
        <div><span class="tagline">訂閱方案|由公司付款</span><h4 id="subTier"></h4><p id="subDesc"></p></div>
        <div class="money" id="subFee"></div></div>
        <button class="mini-btn line" onclick="location.href='subscription.html'">方案管理</button><button class="mini-btn" onclick="location.href='invite_employee.html'">邀請員工</button>
      </div>

      <div class="sect">員工帳號</div>
      <div class="card" style="padding:6px 16px" id="memberList"></div>

      <div class="sect">常用功能</div>
      <div class="grid-fn" id="fnGrid"></div>
      <div id="invites"></div>

      <p class="foot">本 APP 由 安家生活GO・安家生活網・房產與生活服務平台・互動開發工作室 聯合開發<br>© Copyright 2026 All Rights Reserved</p>
    </div>
  </main>
</div>
<div class="modal-mask" id="mask">
  <div class="sheet" style="height:auto;max-height:80dvh;overflow:auto">
    <h3 style="margin:20px 20px 10px;color:var(--brown);font-size:17px">🏠 房屋指派</h3>
    <div style="padding:0 20px 24px">
      <label style="font-size:12.5px;color:var(--brown2);font-weight:700">房屋</label>
      <select id="asProp" style="width:100%;padding:12px;border:1.5px solid var(--beige2);border-radius:12px;font-size:14px;background:var(--surface);color:var(--brown)"></select>
      <label style="font-size:12.5px;color:var(--brown2);font-weight:700;display:block;margin-top:10px">員工</label>
      <select id="asEmp" style="width:100%;padding:12px;border:1.5px solid var(--beige2);border-radius:12px;font-size:14px;background:var(--surface);color:var(--brown)"></select>
      <p style="font-size:11.5px;color:var(--brown2);margin:10px 2px 0">管理員=代管該屋(帳務/報修);業務=負責帶看銷售。已指派的房屋可再次操作取消。</p>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn ghost" style="flex:1" onclick="closeAssign()">取消</button>
        <button class="btn primary" id="asGo" style="flex:1">確認指派(管理員)</button>
        <button class="btn line" id="asGoAgent" style="flex:1">確認指派(業務)</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="dashboard_company.js?v=20261115h"></script>
<script src="assets/js/notify.js?v=20261114e"></script>
<script src="assets/js/tabbar.js?v=20261114e"></script>
</body>
</html>
