<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報修管理|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261114e">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>報修管理</h2>
    <p>回報・受理・結案</p>
    <div class="feat">
      <div>📸 報修可附現場照片(最多 3 張)</div>
      <div>🚨 緊急事件排在最上面</div>
      <div>💬 受理後可直接聯絡報修人</div>
      <div>✅ 完成時自動通知報修人</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="nav"><a class="back" href="dashboard.html" id="navBack" aria-label="返回首頁">←</a> 報修管理</div>

      <div class="lhead" style="margin-top:14px">
        <div class="sect" id="listTitle">報修列表</div>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn small line" id="vendorBtn" style="letter-spacing:1px">🔧 廠商名單</button>
          <button type="button" class="btn small" id="newRepairBtn" style="letter-spacing:1px">+ 新增報修</button>
        </div>
      </div>

      <div class="card" id="payLedger" style="display:none;padding:12px 16px">
        <div class="bd-sec" style="margin-top:0">💰 工款付款記錄</div>
        <div id="payLedgerList" style="max-height:280px;overflow:auto"></div>
        <button type="button" class="mini-btn line" id="payLedgerClose" style="margin-top:8px">收合</button>
      </div>

      <div id="billModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;align-items:center;justify-content:center;padding:18px">
        <div class="card" style="max-width:420px;width:100%;max-height:86vh;overflow:auto">
          <div class="bd-sec" style="margin-top:0">🧾 完工+請款</div>
          <div id="billSolutionWrap">
            <label style="font-size:13px">完工說明*</label>
            <textarea id="billSolution" rows="2" maxlength="500" placeholder="例:更換加熱棒,測試點火正常" style="width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--beige2);border-radius:10px;margin:4px 0 10px;font-family:inherit"></textarea>
          </div>
          <div id="billPhotosWrap">
            <label style="font-size:13px">施工照片(選填,最多 3 張)</label>
            <input type="file" id="billPhotos" accept="image/*" multiple style="margin:4px 0 12px;font-size:13px">
          </div>
          <label style="font-size:13px">工款金額(元)*</label>
          <input type="number" id="billAmount" min="1" step="1" style="width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--beige2);border-radius:10px;margin:4px 0 10px">
          <label style="font-size:13px">備註(選填)</label>
          <input type="text" id="billNote" maxlength="200" placeholder="例:熱水器更換零件工資" style="width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--beige2);border-radius:10px;margin:4px 0 10px">
          <label style="font-size:13px">請款憑證照片(收據/發票,必傳)*</label>
          <input type="file" id="billProof" accept="image/*" multiple style="margin:4px 0 12px;font-size:13px">
          <div id="billProofPrev" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
          <div style="display:flex;gap:8px">
            <button type="button" class="mini-btn" id="billSubmit">送出請款</button>
            <button type="button" class="mini-btn line" id="billCancel">取消</button>
          </div>
        </div>
      </div>

      <div class="card" id="vendorCard" style="display:none;padding:12px 16px">
        <div class="bd-sec" style="margin-top:0">🔧 維修廠商名單</div>
        <div id="vendorList" style="max-height:200px;overflow:auto"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button type="button" class="mini-btn" id="vendorAddBtn">+ 新增廠商</button>
          <button type="button" class="mini-btn line" id="vendorCloseBtn">收合</button>
        </div>
      </div>

      <form id="repairForm" novalidate style="display:none">
        <div class="sect">提交報修</div>
        <div class="field">
          <label for="r_property">選擇房屋*</label>
          <select id="r_property"></select>
        </div>
        <div class="field">
          <label for="r_category">問題類別*</label>
          <select id="r_category">
            <option>水電</option>
            <option>門鎖</option>
            <option>家電</option>
            <option>網路</option>
            <option>漏水</option>
            <option>其他</option>
          </select>
        </div>
        <div class="field">
          <label>緊急程度*</label>
          <div style="display:flex;gap:8px">
            <button type="button" class="mini-btn urg-opt on" data-u="normal">一般</button>
            <button type="button" class="mini-btn line urg-opt" data-u="urgent">🚨 緊急</button>
          </div>
        </div>
        <div class="field">
          <label for="r_desc">問題描述*(3–500 字)</label>
          <textarea id="r_desc" rows="4" style="width:100%;border:1.8px solid var(--beige2);background:var(--surface);border-radius:16px;padding:12px 14px;font-size:15px;color:var(--brown);font-family:inherit;resize:vertical" placeholder="例:廚房水龍頭漏水,關緊後仍滴水"></textarea>
        </div>
        <div class="field">
          <label>現場照片(可選,最多 3 張)</label>
          <div class="upload" id="r_photoBox">📷 點此拍照或選擇照片</div>
          <div id="r_previews" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
        </div>
        <button type="submit" class="btn primary" id="r_sendBtn">送出報修</button>
      </form>

      <div class="field" id="searchWrap" style="margin:0 0 4px">
        <input id="repairSearch" type="search" placeholder="搜尋:房屋/描述/類別" autocomplete="off">
      </div>

      <div id="list" style="margin-top:6px"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="assets/js/lightbox.js?v=20261114e"></script>
<script src="repairs.js?v=20261114e"></script>
<script src="assets/js/notify.js?v=20261114e"></script>
<script src="assets/js/tabbar.js?v=20261114e"></script>
</body>
</html>
