<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房客主頁|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261114e">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>房客主頁</h2>
    <p>繳費、報修、聯絡房東<br>免費使用</p>
    <div class="feat">
      <div>🔑 由房東或公司邀請綁定租約</div>
      <div>💳 合併帳單線上繳費(開發中)</div>
      <div>🔧 線上報修(開發中)</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="dash-head">
        <div class="avatar" id="avatar">…</div>
        <div class="who"><b id="greet">載入中…</b><span class="pill">房客</span><span>免費使用</span></div>
        <a class="bell" href="notifications.html" aria-label="通知中心">🔔<i id="bellBadge" style="display:none"></i></a>
      </div>

      <div class="card" id="pendingLeaseCard" style="display:none"></div>

      <div class="card" id="leaseCard"><div class="row"><div class="ico">🔑</div>
        <div><span class="tagline">我的租約</span><h4>尚未綁定租約</h4><p>請由房東或公司發送邀請綁定租約後,即可查看帳單、電費明細與線上報修。</p></div></div>
      </div>

      <div class="sect">常用功能</div>
      <div class="grid-fn">
        <div class="fn" onclick="location.href='bills.html'"><i>💰</i><span>繳費紀錄</span></div>
        <div class="fn" onclick="location.href='electricity.html'"><i>⚡</i><span>電費明細</span></div>
        <div class="fn" onclick="location.href='repairs.html'"><i>🔧</i><span>線上報修</span></div>
        <div class="fn" onclick="location.href='documents.html'"><i>📄</i><span>文件簽署</span></div>
        <div class="fn" onclick="location.href='messages.html'"><i>💬</i><span>聯絡房東</span></div>
        <div class="fn" onclick="location.href='notifications.html'"><i>🔔</i><span>通知</span></div>
        <div class="fn" onclick="toast('生活資訊開發中')"><i>🗺️</i><span>生活資訊</span></div>
      </div>

      <p class="foot">本 APP 由 安家生活GO・安家生活網・房產與生活服務平台・互動開發工作室 聯合開發<br>© Copyright 2026 All Rights Reserved</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="dashboard_tenant.js?v=20261114e"></script>
<script src="assets/js/notify.js?v=20261114e"></script>
<script src="assets/js/tabbar.js?v=20261114e"></script>
</body>
</html>
