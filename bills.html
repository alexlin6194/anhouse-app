<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>帳單管理|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261114e">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>帳單管理</h2>
    <p>應收・逾期・催繳</p>
    <div class="feat">
      <div>⏰ 逾期帳單自動排在最上方</div>
      <div>👆 點帳單看房屋狀況與房客資料</div>
      <div>📣 一鍵發送催繳通知給房客</div>
      <div>⚡ 電費抄錄需先拍電錶照片</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="nav"><a class="back" href="dashboard.html" id="navBack" aria-label="返回首頁">←</a> 帳單管理</div>

      <div class="stats" id="stats">
        <div class="stat"><b id="stOverdue">–</b><span>逾期筆數</span></div>
        <div class="stat"><b id="stPending">–</b><span>待繳金額</span></div>
        <div class="stat"><b id="stPaid">–</b><span>已繳筆數</span></div>
      </div>

      <div class="lhead">
        <div class="sect">全部帳單</div>
        <span style="font-size:11.5px;color:var(--brown2)">逾期排最上,點卡片看明細</span>
      </div>
      <div id="list"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="assets/js/lightbox.js?v=20261114e"></script>
<script src="assets/js/meter.js?v=20261114e"></script>
<script src="bills.js?v=20261114e"></script>
<script src="assets/js/notify.js?v=20261114e"></script>
<script src="assets/js/tabbar.js?v=20261114e"></script>
</body>
</html>
