<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文件簽署|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261115bbb">
<style>
  #padCanvas { touch-action: none; width: 100%; height: 190px; border: 1.8px dashed var(--beige2); border-radius: 14px; background: #fff; display: block; }
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; padding: 24px 8px; color: #000; }
    #printArea pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.8; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>文件簽署</h2>
    <p>電子合約・確認函</p>
    <div class="feat">
      <div>📜 租賃契約書:房東發起・房客簽名・屋主副署</div>
      <div>🖊 手寫電子簽名,留存簽名影像</div>
      <div>🕒 簽署時間/IP 全程軌跡留存</div>
      <div>🖨 簽署完成可列印或存成 PDF</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="nav"><a class="back" href="dashboard.html" id="navBack" aria-label="返回首頁">←</a> 文件簽署</div>

      <div class="lhead" style="margin-top:14px">
        <div class="sect">文件列表</div>
        <button type="button" class="btn small" id="newContractBtn" style="display:none;letter-spacing:1px">+ 發起租約簽約</button>
      </div>
      <form id="newContractForm" novalidate style="display:none">
        <div class="sect">發起租約電子簽約</div>
        <div class="field">
          <label for="ncLease">選擇租約*</label>
          <select id="ncLease"></select>
          <p class="hint">將依租約資料自動產生完整「房屋租賃契約書」,房客先簽名、屋主副署後生效</p>
        </div>
        <div class="field">
          <label>各項費用說明(留空=依標準條款;可填金額如「NT$300 元/月」或自訂說明)</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
            <div><label style="font-size:12px">水費</label><input id="ncWater" maxlength="60" placeholder="留空=按度實算"></div>
            <div><label style="font-size:12px">瓦斯費</label><input id="ncGas" maxlength="60" placeholder="留空=向瓦斯公司繳付"></div>
            <div><label style="font-size:12px">管理費</label><input id="ncMgmt" maxlength="60" placeholder="留空=依房屋設定"></div>
            <div><label style="font-size:12px">網路費</label><input id="ncNetwork" maxlength="60" placeholder="留空=自行申裝"></div>
            <div><label style="font-size:12px">車位費</label><input id="ncParking" maxlength="60" placeholder="留空=未含車位"></div>
            <div><label style="font-size:12px">其他費用</label><input id="ncMisc" maxlength="60" placeholder="第四台/電話等"></div>
          </div>
        </div>
        <div class="field">
          <label for="ncExtra">現場附加條件/特別約定事項(選填,手動輸入)</label>
          <textarea id="ncExtra" rows="4" maxlength="1000" placeholder="例:附家具(雙人床、衣櫃、冷氣各一);經點交確認現況;房客得飼養寵物;退租清潔費 NT$1,500 元由房客負擔"></textarea>
        </div>
        <div style="display:flex;gap:10px">
          <button type="submit" class="btn primary" style="flex:1.6;font-size:15.5px">📜 產生契約書並發起簽署</button>
          <button type="button" class="btn ghost" id="ncCancel" style="flex:1">取消</button>
        </div>
      </form>
      <div id="list"></div>
    </div>
  </main>
</div>
<div class="modal-mask" id="docMask"><div class="sheet" style="height:92dvh">
  <div class="sheet-head"><b id="docTitle"></b><button class="sheet-close" id="docClose">✕</button></div>
  <div class="sheet-body" id="docBody" style="white-space:pre-wrap;font-size:13.5px"></div>
  <div class="sheet-foot" id="docFoot"></div>
</div></div>
<div class="modal-mask" id="padMask">
  <div class="sheet" style="height:auto;max-width:430px;width:92%">
    <div class="sheet-head"><b id="padWho">✍ 手寫簽名</b><button class="sheet-close" id="padClose">✕</button></div>
    <div class="sheet-body" style="padding:12px 16px">
      <p style="font-size:12px;color:var(--brown2);margin:0 0 8px">請用手指(或滑鼠)在白框內簽名,簽名將作為電子簽章存檔</p>
      <canvas id="padCanvas"></canvas>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button type="button" class="btn ghost" id="padClear" style="flex:1">清除重簽</button>
        <button type="button" class="btn primary" id="padOk" style="flex:1">確認簽名</button>
      </div>
    </div>
  </div>
</div>
<div id="printArea"></div>
<div class="toast" id="toast" role="status"></div>
<script src="documents.js?v=20261115fff"></script>
<script src="assets/js/notify.js?v=20261114o"></script>
<script src="assets/js/tabbar.js?v=20261114o"></script>
</body>
</html>
