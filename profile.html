<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會員中心|安家生活GO</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261115n">
</head>
<body>
<div class="shell">
  <aside class="side">
    <h2>會員中心</h2>
    <p>帳號資料與安全</p>
    <div class="feat">
      <div>🔐 定期更換密碼更安全</div>
      <div>📵 變更手機將於正式版開放</div>
      <div>👤 帳號即身份,請勿借人使用</div>
    </div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="nav"><a class="back" id="navBack" href="dashboard.html" aria-label="返回首頁">←</a> 會員中心</div>

      <div class="sect">我的帳號</div>
      <div class="card" id="accCard" style="padding:14px 16px">載入中…</div>

      <div class="sect">變更密碼</div>
      <form id="pwForm" novalidate>
        <div class="field">
          <label for="cur">目前的密碼*</label>
          <div class="pw-wrap">
            <input id="cur" type="password" autocomplete="current-password">
            <button type="button" class="pw-eye" data-for="cur" aria-label="顯示密碼">
              <svg class="i-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a19.8 19.8 0 0 1-3.22 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="npw">新密碼*(8 碼以上,含英文與數字)</label>
          <div class="pw-wrap">
            <input id="npw" type="password" autocomplete="new-password">
            <button type="button" class="pw-eye" data-for="npw" aria-label="顯示密碼">
              <svg class="i-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a19.8 19.8 0 0 1-3.22 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="hint" id="hint-npw" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="cpw">確認新密碼*</label>
          <div class="pw-wrap">
            <input id="cpw" type="password" autocomplete="new-password">
            <button type="button" class="pw-eye" data-for="cpw" aria-label="顯示密碼">
              <svg class="i-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a19.8 19.8 0 0 1-3.22 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="hint" id="hint-cpw" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn primary" id="saveBtn">更新密碼</button>
      </form>

      <div class="sect">其他設定</div>
      <div class="card" style="padding:12px 16px">
        <div class="list-item"><div><b>變更手機號碼</b><span>正式版開放:需簡訊驗證新手機</span></div><span class="st idle">即將推出</span></div>
        <div class="list-item" id="subRow" style="display:none;cursor:pointer"><div><b>廠商訂閱(月費)</b><span>管理訂閱方案與付款紀錄</span></div><span class="st">前往 ›</span></div>
      </div>

      <button type="button" class="btn" id="logoutBtn" style="margin-top:18px;background:var(--err-bg);color:var(--err);border:1.8px solid var(--err);letter-spacing:2px">登出</button>

      <p class="foot">修改密碼後其他裝置將自動登出(下次造訪時)。<br>若忘記密碼,請於登入頁使用「忘記密碼」。</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="assets/js/pw.js?v=20261114e"></script>
<script src="profile.js?v=20261114e"></script>
<script src="assets/js/notify.js?v=20261114e"></script>
<script src="assets/js/tabbar.js?v=20261114e"></script>
</body>
</html>
